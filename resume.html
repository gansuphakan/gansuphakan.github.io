
<!DOCTYPE html>
<html>
<body>
<script src="https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/latex.js"></script>
<script>
fetch("resume.tex")
  .then(response => response.text())
  .then(source => {
    const generator = latexjs.parse(source, {
      generator: new latexjs.HtmlGenerator()
    });

    document.head.appendChild(
      generator.stylesAndScripts(
        "https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/"
      )
    );

    document.body.appendChild(generator.domFragment());
  });
</script>
</body>
</html>
